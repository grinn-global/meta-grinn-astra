# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-grinn-astra-bsp"
BBFILE_PATTERN_meta-grinn-astra-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-grinn-astra-bsp = "10"

LAYERDEPENDS_meta-grinn-astra-bsp = "core"
LAYERSERIES_COMPAT_meta-grinn-astra-bsp = "scarthgap"

# Synaptics rescue bbappend for swupdate-image is dangling without meta-swupdate
BBMASK += "meta-synaptics/recipes-rescue/astra-rescue/swupdate-image.bbappend"
