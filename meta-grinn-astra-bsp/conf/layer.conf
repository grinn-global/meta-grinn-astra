# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-grinn-astra-bsp"
BBFILE_PATTERN_meta-grinn-astra-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-grinn-astra-bsp = "30"

LAYERDEPENDS_meta-grinn-astra-bsp = "core"
LAYERSERIES_COMPAT_meta-grinn-astra-bsp = "kirkstone"

# Disable Synaptics rescue image related bbappend so it can be replaced
# with the one from this layer
BBMASK += "meta-synaptics/recipes-rescue/astra-rescue/synasdk-config-native_git.bbappend"
