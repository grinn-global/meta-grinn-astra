device_type: {{ job.KAS_MACHINE }}
job_name: "{{ job.KAS_TARGET }}-{{ job.KAS_MACHINE }}-{{ job.CI_PIPELINE_ID }}"
timeouts:
  job:
    minutes: 60
  actions:
    http-download:
      minutes: 30
    download-retry:
      minutes: 35
priority: medium
visibility: public

actions:
  - command:
      name: power_on
  - deploy:
      timeout:
        minutes: 40
      to: tftp
      kernel:
        url: "{{ job.CI_API_V4_URL }}/projects/{{ job.CI_PROJECT_ID }}/jobs/{{ job.BUILD_JOB_ID }}/artifacts/build/tmp/deploy/images/{{ job.KAS_MACHINE }}/Image-{{ job.KAS_MACHINE }}.bin?job_token={{ job.CI_JOB_TOKEN }}"
      dtb:
        url: "{{ job.CI_API_V4_URL }}/projects/{{ job.CI_PROJECT_ID }}/jobs/{{ job.BUILD_JOB_ID }}/artifacts/build/tmp/deploy/images/{{ job.KAS_MACHINE }}/{{ job.KAS_MACHINE }}.dtb?job_token={{ job.CI_JOB_TOKEN }}"
      nfsrootfs:
        url: "{{ job.CI_API_V4_URL }}/projects/{{ job.CI_PROJECT_ID }}/jobs/{{ job.BUILD_JOB_ID }}/artifacts/build/tmp/deploy/images/{{ job.KAS_MACHINE }}/{{ job.KAS_TARGET }}-{{ job.KAS_MACHINE }}.rootfs.tar.xz?job_token={{ job.CI_JOB_TOKEN }}"
        compression: xz

  - boot:
      method: u-boot
      timeout:
        minutes: 10
      commands:
        - net_init
        - setenv skip_fdt_update 2
        - dhcp
        - "" # Force a prompt return
        - setenv autoload no
        - setenv serverip {SERVER_IP}
        - setenv bootargs "console=ttyS0,115200 root=/dev/nfs rw nfsroot={NFS_SERVER_IP}:{NFSROOTFS},v3,tcp ip=dhcp rootwait avio.fastlogo_status=104500 cma=524288000@1556086784"
        - setenv loadaddr 0x7c00000
        - setenv dtbaddr 0x47f1000
        - tftpboot ${dtbaddr} {DTB}
        - "" # Force a prompt return
        - tftpboot ${loadaddr} {KERNEL}
        - "" # Force a prompt return
        - booti ${loadaddr} - ${dtbaddr}
      soft_reboot: reset
      auto_login:
        login_prompt: "login:.*"
        username: root
      prompts:
        - "root@{{ job.KAS_MACHINE }} login:~#"
        - "root@.*:~#"
        - "~#"
