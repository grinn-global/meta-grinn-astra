spec:
  inputs:
    sstate-mirror:
      type: boolean
      default: true
      description: Use shared sstate mirror
    downloads-mirror:
      type: boolean
      default: true
      description: Use shared downloads mirror

---

include:
  - component: $CI_SERVER_FQDN/grinn/ci/yocto/kas/workflow@1
  - component: $CI_SERVER_FQDN/grinn/ci/yocto/kas/build@1
    inputs:
      image-name: ghcr.io/siemens/kas/kas:5.1-debian-bookworm
      sstate-mirror: $[[ inputs.sstate-mirror ]]
      downloads-mirror: $[[ inputs.downloads-mirror ]]
  - component: $CI_SERVER_FQDN/grinn/ci/yocto/kas/lava@1

stages:
  - ci-kas
  - build
  - test

.ci_build_matrix: &ci_build_matrix
  parallel:
    matrix:
      - KAS_MACHINE:
        - grinn-astra-1680-ada
        - grinn-astra-1680-evb
        - grinn-astra-1680-sbc
        - grinn-astra-2619-sbc

.ci_test_matrix: &ci_test_matrix
  parallel:
    matrix:
      - KAS_MACHINE:
        - grinn-astra-1680-ada
        - grinn-astra-1680-evb
        - grinn-astra-1680-sbc

build:
  <<: *ci_build_matrix
  variables:
    KAS_TARGET: astra-media
  artifacts:
    expire_in: 1d
    paths:
      - build.log
      - build/tmp/deploy/images/*/*.rootfs.tar.xz
      - build/tmp/deploy/images/*/Image-*.bin
      - build/tmp/deploy/images/*/*.dtb
      - build/tmp/deploy/images/*/SYNAIMG

lava:
  <<: *ci_test_matrix
  needs:
    - lava-pre
    - job: build
      artifacts: true
      parallel:
        matrix:
          - KAS_MACHINE: ['$[[ matrix.KAS_MACHINE ]]']
