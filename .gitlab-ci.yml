spec:
  inputs:
    sstate-mirror:
      type: boolean
      default: true
      description: Use shared sstate mirror
    downloads-mirror:
      type: boolean
      default: true
      description: Use shared downloads mirror
    git-mirror:
      type: boolean
      default: true
      description: Use git mirrors

---

include:
  - component: $CI_SERVER_FQDN/grinn/ci/yocto/kas/deploy-public@2
  - component: $CI_SERVER_FQDN/grinn/ci/yocto/kas/workflow@2
  - component: $CI_SERVER_FQDN/grinn/ci/yocto/kas/build@2
    inputs:
      image-name: ghcr.io/siemens/kas/kas:5.2-debian-bookworm
      sstate-mirror: $[[ inputs.sstate-mirror ]]
      downloads-mirror: $[[ inputs.downloads-mirror ]]
      git-mirror: $[[ inputs.git-mirror ]]
  - component: $CI_SERVER_FQDN/grinn/ci/yocto/kas/lava@1

stages:
  - ci-kas
  - build
  - test
  - deploy

.ci_build_matrix: &ci_build_matrix
  parallel:
    matrix:
      - KAS_MACHINE:
          - grinn-astra-1680-ada
          - grinn-astra-1680-sbc
          - grinn-astra-2619-sbc
        KAS_CONFIG:
          - default
      - KAS_MACHINE:
          - grinn-astra-1680-sbc
        KAS_CONFIG:
          - default:deepx

.ci_test_matrix: &ci_test_matrix
  parallel:
    matrix:
      - KAS_MACHINE:
          - grinn-astra-1680-ada
          - grinn-astra-1680-sbc
        KAS_CONFIG:
          - default
      - KAS_MACHINE:
          - grinn-astra-1680-sbc
        KAS_CONFIG:
          - default:deepx

build:
  <<: *ci_build_matrix
  variables:
    KAS_TARGET: astra-media
  artifacts:
    expire_in: 1d
    paths:
      - build.log
      - build/tmp/deploy/images/*/*.rootfs.tar.zst
      - build/tmp/deploy/images/*/*.rootfs.synaimg.tar.zst
      - build/tmp/deploy/images/*/*.rootfs.synaimg.tar.zst.sha256sum
      - build/tmp/deploy/images/*/*.rootfs.synaimg_bootloader.tar.zst
      - build/tmp/deploy/images/*/Image-*.bin
      - build/tmp/deploy/images/*/*.dtb

lava:
  <<: *ci_test_matrix
  needs:
    - lava-pre
    - job: build
      artifacts: true
      parallel:
        matrix:
          - KAS_MACHINE: ['$[[ matrix.KAS_MACHINE ]]']
            KAS_CONFIG: ['$[[ matrix.KAS_CONFIG ]]']

deploy-public:
  <<: *ci_build_matrix
  variables:
    KAS_TARGET: astra-media
    DEPLOY_PUBLIC_FILE: build/tmp/deploy/images/$KAS_MACHINE/$KAS_TARGET-$KAS_MACHINE.rootfs.synaimg.tar.zst
  needs:
    - job: build
      artifacts: true
      parallel:
        matrix:
          - KAS_MACHINE: ['$[[ matrix.KAS_MACHINE ]]']
            KAS_CONFIG: ['$[[ matrix.KAS_CONFIG ]]']
